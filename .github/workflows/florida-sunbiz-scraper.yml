name: florida-sunbiz-scraper
on:
  push:
    paths:
      - "actors/florida-sunbiz-scraper/**"
      - ".github/workflows/florida-sunbiz-scraper.yml"
permissions:
  contents: write
concurrency:
  group: florida-sunbiz-scraper
  cancel-in-progress: false
env:
  ACTOR_DIR: actors/florida-sunbiz-scraper
  OUT: ci/florida-sunbiz-scraper
jobs:
  test-and-run:
    runs-on: ubuntu-latest
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare output folder
        run: mkdir -p "$OUT" && rm -f "$OUT"/*.log "$OUT"/*.json && echo "run $(date -u +%FT%TZ) sha ${GITHUB_SHA}" > "$OUT/00-meta.log"
      - name: Install
        run: (cd "$ACTOR_DIR" && npm install --no-audit --no-fund) > "$OUT/01-install.log" 2>&1 || echo "exit $?" >> "$OUT/01-install.log"
      - name: Unit tests
        run: (cd "$ACTOR_DIR" && npm test) > "$OUT/02-test.log" 2>&1 || echo "exit $?" >> "$OUT/02-test.log"
      - name: Install Firefox for Playwright
        run: (cd "$ACTOR_DIR" && npx playwright install --with-deps firefox) > "$OUT/03-firefox.log" 2>&1 || echo "exit $?" >> "$OUT/03-firefox.log"
      - name: Local runs against Sunbiz
        run: |
          cd "$ACTOR_DIR"
          for f in ci-inputs/*.json; do
            name=$(basename "$f" .json)
            rm -rf storage && mkdir -p storage/key_value_stores/default
            node -e 'const i=require("./'"$f"'"); delete i.proxyConfiguration; require("fs").writeFileSync("storage/key_value_stores/default/INPUT.json", JSON.stringify(i))'
            SUNBIZ_DEBUG=1 timeout 600 npm start > "../../$OUT/04-local-$name.log" 2>&1 || echo "exit $?" >> "../../$OUT/04-local-$name.log"
            for d in storage/key_value_stores/default/DEBUG-*; do [ -e "$d" ] && cp "$d" "../../$OUT/debug-$name-$(basename "$d")"; done; true
            node -e '
              const fs=require("fs");const dir="storage/datasets/default";
              const items=fs.existsSync(dir)?fs.readdirSync(dir).filter(f=>f.endsWith(".json")).map(f=>JSON.parse(fs.readFileSync(dir+"/"+f))):[];
              fs.writeFileSync("../../'"$OUT"'/local-dataset-'"$name"'.json", JSON.stringify(items,null,2));
              console.log("items:", items.length);
            ' >> "../../$OUT/04-local-$name.log" 2>&1 || true
          done
      - name: Deploy to Apify
        if: env.APIFY_TOKEN != ''
        run: |
          cd "$ACTOR_DIR"
          (npm install -g apify-cli && apify login -t "$APIFY_TOKEN" && apify push --no-prompt --force && bash ../../scripts/apify-configure.sh florida-sunbiz-scraper) 2>&1 | grep -v -i "token" > "../../$OUT/05-deploy.log" || echo "exit $?" >> "../../$OUT/05-deploy.log"
      - name: Run on Apify
        if: env.APIFY_TOKEN != ''
        run: |
          cd "$ACTOR_DIR"
          bash ../../scripts/apify-run.sh florida-sunbiz-scraper ci-inputs/entity-name.json "../../$OUT" > "../../$OUT/06-apify-run.log" 2>&1 || echo "exit $?" >> "../../$OUT/06-apify-run.log"
      - name: Commit results
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A "$OUT" || true
          git commit -m "ci: florida-sunbiz-scraper results $(date -u +%FT%TZ)" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push || true
