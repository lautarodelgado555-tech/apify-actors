# Recon for the Georgia eCorp portal: five parallel runners, each drives Firefox through the in-page fetch flow.
name: recon-georgia-sos-scraper
on:
  push:
    paths:
      - "recon/georgia-sos-scraper/targets.json"
      - "recon/georgia-sos-scraper/spike.mjs"
      - ".github/workflows/recon-georgia-sos-scraper.yml"
permissions:
  contents: write
concurrency:
  group: recon-georgia-sos-scraper
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5]
    env:
      JOB: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install clients
        run: |
          mkdir -p /tmp/rc && cd /tmp/rc && npm init -y >/dev/null && npm i playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium firefox >/dev/null 2>&1 || true
          ln -sfn /tmp/rc/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Fetch
        run: |
          mkdir -p recon/georgia-sos-scraper/out
          timeout 1500 xvfb-run -a node recon/georgia-sos-scraper/spike.mjs > /tmp/recon-run.log 2>&1 || true
          cp /tmp/recon-run.log recon/georgia-sos-scraper/out/run-$JOB.log
      - name: Commit results
        if: always()
        run: |
          unlink node_modules || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A recon/georgia-sos-scraper/out
          git commit -m "recon(georgia-sos-scraper): results job $JOB $(date -u +%FT%TZ)" || echo "nothing to commit"
          for i in 1 2 3 4 5 6; do git pull --rebase --autostash && git push && break; sleep $((RANDOM % 10 + 2)); done
