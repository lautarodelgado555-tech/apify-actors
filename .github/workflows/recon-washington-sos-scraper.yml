name: recon-washington-sos-scraper
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recon-washington-sos-scraper
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install clients
        run: |
          mkdir -p /tmp/rc && cd /tmp/rc && npm init -y >/dev/null && npm i got-scraping playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium firefox >/dev/null 2>&1 || true
          ln -sfn /tmp/rc/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Recon variants
        run: |
          mkdir -p recon/washington-sos-scraper/out
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          (cd /tmp/rc && npx playwright install --with-deps chrome >/dev/null 2>&1) || true
          VARIANT=chromium-gl node recon/washington-sos-scraper/recon.mjs > /tmp/v1.log 2>&1 || true
          VARIANT=chromium-gl-headed xvfb-run -a node recon/washington-sos-scraper/recon.mjs > /tmp/v2.log 2>&1 || true
          VARIANT=chrome-gl-headed xvfb-run -a node recon/washington-sos-scraper/recon.mjs > /tmp/v3.log 2>&1 || true
          VARIANT=chrome-headless node recon/washington-sos-scraper/recon.mjs > /tmp/v4.log 2>&1 || true
          cat /tmp/v1.log /tmp/v2.log /tmp/v3.log /tmp/v4.log | grep -v "Feature Policy\|Referrer\|downloadable font\|deprecated" > recon/washington-sos-scraper/out/stdout.log
      - name: Commit results
        if: always()
        run: |
          unlink node_modules || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A recon/washington-sos-scraper/out
          git commit -m "recon(washington-sos-scraper): results $(date -u +%FT%TZ)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep $((RANDOM % 8 + 2)); done
