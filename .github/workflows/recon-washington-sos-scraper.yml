name: recon-washington-sos-scraper
on:
  push:
    paths:
      - "recon/washington-sos-scraper/*.mjs"
      - "recon/washington-sos-scraper/targets.json"
      - ".github/workflows/recon-washington-sos-scraper.yml"
permissions:
  contents: write
concurrency:
  group: recon-washington-sos-scraper
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install clients
        run: |
          mkdir -p /tmp/rc && cd /tmp/rc && npm init -y >/dev/null && npm i got-scraping playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium firefox >/dev/null 2>&1 || true
          ln -sfn /tmp/rc/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Recon variants
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          mkdir -p recon/washington-sos-scraper/out
          PW=$(curl -sS -H "Authorization: Bearer $APIFY_TOKEN" https://api.apify.com/v2/users/me | node -pe 'const d=JSON.parse(require("fs").readFileSync(0)); (d.data.proxy||{}).password||""')
          [ -n "$PW" ] && echo "::add-mask::$PW"
          export APIFY_PROXY_PASSWORD="$PW"
          echo "proxy password present: $([ -n "$PW" ] && echo yes || echo no)" > /tmp/proxy.log
          VARIANT=probe node recon/washington-sos-scraper/recon.mjs > /tmp/probe.log 2>&1 || true
          VARIANT=firefox node recon/washington-sos-scraper/recon.mjs > /tmp/firefox.log 2>&1 || true
          VARIANT=firefox-resi node recon/washington-sos-scraper/recon.mjs > /tmp/ffresi.log 2>&1 || true
          VARIANT=chromium-resi node recon/washington-sos-scraper/recon.mjs > /tmp/chresi.log 2>&1 || true
          cat /tmp/proxy.log /tmp/probe.log /tmp/firefox.log /tmp/ffresi.log /tmp/chresi.log | grep -v -i "password" > recon/washington-sos-scraper/out/stdout.log
      - name: Commit results
        if: always()
        run: |
          unlink node_modules || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A recon/washington-sos-scraper/out
          git commit -m "recon(washington-sos-scraper): results $(date -u +%FT%TZ)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep $((RANDOM % 8 + 2)); done
