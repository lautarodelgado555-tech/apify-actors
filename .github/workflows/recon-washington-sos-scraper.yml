name: recon-washington-sos-scraper
on:
  push:
    paths:
      - "recon/washington-sos-scraper/*.mjs"
      - "recon/washington-sos-scraper/targets.json"
      - ".github/workflows/recon-washington-sos-scraper.yml"
permissions:
  contents: write
concurrency:
  group: recon-washington-sos-scraper
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install clients
        run: |
          mkdir -p /tmp/rc && cd /tmp/rc && npm init -y >/dev/null && npm i got-scraping playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium firefox >/dev/null 2>&1 || true
          ln -sfn /tmp/rc/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Recon variants
        run: |
          mkdir -p recon/washington-sos-scraper/out
          VARIANT=probe node recon/washington-sos-scraper/recon.mjs > /tmp/probe.log 2>&1 || true
          VARIANT=chromium node recon/washington-sos-scraper/recon.mjs > /tmp/chromium.log 2>&1 || true
          VARIANT=firefox node recon/washington-sos-scraper/recon.mjs > /tmp/firefox.log 2>&1 || true
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          VARIANT=chromium-headed xvfb-run -a node recon/washington-sos-scraper/recon.mjs > /tmp/headed.log 2>&1 || true
          VARIANT=firefox-headed xvfb-run -a node recon/washington-sos-scraper/recon.mjs > /tmp/ffheaded.log 2>&1 || true
          cat /tmp/probe.log /tmp/chromium.log /tmp/firefox.log /tmp/headed.log /tmp/ffheaded.log > recon/washington-sos-scraper/out/stdout.log
      - name: Commit results
        if: always()
        run: |
          unlink node_modules || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A recon/washington-sos-scraper/out
          git commit -m "recon(washington-sos-scraper): results $(date -u +%FT%TZ)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep $((RANDOM % 8 + 2)); done
