name: store-stats
on:
  schedule:
    - cron: "52 11 * * *" # 08:52 Buenos Aires, before the daily review task
  push:
    paths:
      - "scripts/store-stats.mjs"
      - ".github/workflows/store-stats.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: store-stats
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Snapshot stats
        run: mkdir -p ci/store-stats && node scripts/store-stats.mjs > ci/store-stats/run.log 2>&1 || echo "exit $?" >> ci/store-stats/run.log
      - name: Commit results
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A ci/store-stats
          git commit -m "ci: store stats $(date -u +%FT%TZ)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep $((RANDOM % 8 + 2)); done
