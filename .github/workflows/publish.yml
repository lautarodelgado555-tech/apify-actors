name: publish
on:
  push:
    paths:
      - "actors/*/.actor/store.json"
      - "scripts/apify-publish.sh"
      - ".github/workflows/publish.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply listing and pricing for every Actor that has a store.json
        run: |
          mkdir -p ci
          for store in actors/*/.actor/store.json; do
            dir=$(dirname "$(dirname "$store")")
            name=$(basename "$dir")
            mkdir -p "ci/$name"
            bash scripts/apify-publish.sh "$name" "$dir" > "ci/$name/07-publish.log" 2>&1 || echo "exit $?" >> "ci/$name/07-publish.log"
          done
      - name: Commit results
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A ci || true
          git commit -m "ci: listing results $(date -u +%FT%TZ)" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push || true
